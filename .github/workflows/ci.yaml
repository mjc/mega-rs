name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check_fmt:
    name: Check code formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
  run_tests:
    name: Run Cargo tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@1.98.1
      - name: Run Cargo tests
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
          MEGA_SESSION: ${{ secrets.MEGA_SESSION }}
          MEGA_PUBLIC_URL: ${{ secrets.MEGA_PUBLIC_URL }}
          MEGA_PROTECTED_URL: ${{ secrets.MEGA_PROTECTED_URL }}
          MEGA_PROTECTED_PASSWORD: ${{ secrets.MEGA_PROTECTED_PASSWORD }}
        run: cargo test --all-features --locked
  dependency_checks:
    name: Check dependency policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@1.98.1
      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.98.1"
          arguments: --all-features --locked
      - name: Audit dependencies
        run: cargo audit
